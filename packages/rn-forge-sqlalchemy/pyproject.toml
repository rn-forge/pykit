[project]
name = "rn-forge-sqlalchemy"
version = "0.1.0"
description = "Async SQLAlchemy models, upsert and keyset pagination over rn-forge-web"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# Pinned direct URL, not a bare name: these packages are not on PyPI, and a
# release is a tag (kiln D46). `[tool.uv.sources]` below overrides this with
# the workspace checkout for local development only.
#
# No database driver is declared: the application picks one (`asyncpg`,
# `aiosqlite`). `rn-forge-commons` arrives pinned through `rn-forge-web`.
dependencies = [
  "rn-forge-web @ git+https://github.com/rn-forge/pykit@rn-forge-web-v0.1.0#subdirectory=packages/rn-forge-web",
  "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.sqlalchemy"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-web = { workspace = true }
rn-forge-fastapi = { workspace = true }
rn-forge-sqlalchemy = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
markers = [
  "unit: fast isolated tests",
  "postgres: needs a PostgreSQL DSN in RN_FORGE_TEST_POSTGRES_DSN",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "assertpy>=1.1",
  "asyncpg>=0.30",
  "httpx>=0.28.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-fastapi[transfer]",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-sqlalchemy",
]
