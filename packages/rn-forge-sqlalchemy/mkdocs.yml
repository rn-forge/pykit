site_name: rn-forge-sqlalchemy
site_description: Async SQLAlchemy models, upsert and keyset pagination over rn-forge-web
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-sqlalchemy/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mike:
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Using the package: guides/usage.md
  - Reference:
      - reference/index.md
      - Models: reference/models.md
      - Concurrency: reference/concurrency.md
      - Upsert: reference/upsert.md
      - Pagination: reference/pagination.md
  - Changelog: changelog.md
