site_name: rn-forge-tooling
site_description: File-owning developer tooling for the rn-forge-* CLIs
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-tooling/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Generation: guides/generation.md
      - Tool lifecycle: guides/lifecycle.md
  - Reference:
      - reference/index.md
      - Commands: reference/commands.md
      - Generation: reference/generation.md
      - Install: reference/install.md
      - State: reference/state.md
      - Templates: reference/templates.md
  - Changelog: changelog.md
