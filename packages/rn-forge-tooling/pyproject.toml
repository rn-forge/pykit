[project]
name = "rn-forge-tooling"
version = "0.3.0"
description = "Developer-tool lifecycle verbs and install mechanics for the rn-forge-* CLIs"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# Internal requirements are version ranges (ADR-0004).
dependencies = [
  "rn-forge-commons>=0.7.0,<0.8",
  "rn-forge-cli>=0.1.1,<0.2",
]

[project.optional-dependencies]
testing = ["assertpy>=1.1", "pytest>=9.1.1"]

[project.urls]
Documentation = "https://rn-forge.github.io/pykit/packages/rn-forge-tooling/latest/"
Source = "https://github.com/rn-forge/pykit/tree/main/packages/rn-forge-tooling"
Changelog = "https://github.com/rn-forge/pykit/blob/main/packages/rn-forge-tooling/CHANGELOG.md"
Issues = "https://github.com/rn-forge/pykit/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.tooling"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-cli = { workspace = true }
rn-forge-tooling = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib -m 'not scaffold'"
markers = ["scaffold: installs built wheels into a scaffolded application (slow)"]

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-tooling",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-tooling",
]
