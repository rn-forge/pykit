[project]
name = "rn-forge-tooling"
version = "0.2.0"
description = "File-owning developer tooling for the rn-forge-* CLIs: generation, templates, local state, install mechanics and docs checks"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# Pinned direct URLs, not bare names: these packages are not on PyPI, and a
# release is a tag (kiln D46). `[tool.uv.sources]` below overrides these with
# the workspace checkouts for local development only — the declarations here
# are what a consumer outside the workspace actually resolves.
dependencies = [
  "rn-forge-commons @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "rn-forge-cli @ git+https://github.com/rn-forge/pykit@rn-forge-cli-v0.1.0#subdirectory=packages/rn-forge-cli",
  "jinja2>=3.1.6",
  # The docs checkers ask Python-Markdown what anchor a heading gets rather
  # than guessing; mkdocs already brings it, but a checker that only works
  # inside a docs build is not a checker.
  "markdown>=3.7",
]

[project.scripts]
rn-forge-docs = "rn_forge.tooling.cli.docs:app"

[project.optional-dependencies]
testing = ["assertpy>=1.1", "pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.tooling"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-cli = { workspace = true }
rn-forge-tooling = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-tooling",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-tooling",
]
