site_name: rn-forge-fastapi
site_description: FastAPI adapters over rn-forge-web
site_dir: .out/site
use_directory_urls: false

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Wiring an application: guides/wiring.md
      - Tabular export and import: guides/transfer.md
  - API Reference:
      - api/index.md
      - Application: api/app.md
      - Problem: api/problem.md
      - OpenAPI: api/openapi.md
      - Dependencies: api/dependencies.md
      - Health: api/health.md
      - Transfer: api/transfer.md
      - Auth: api/auth.md
