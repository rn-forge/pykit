site_name: rn-forge-web
site_description: Framework-agnostic HTTP/API primitives built on rn-forge-commons
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-web/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mike:
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - API conventions: guides/api-conventions.md
      - Deployment: guides/deployment.md
      - Model conventions: guides/model-conventions.md
      - Wiring into Django: guides/wiring-django.md
      - Wiring into FastAPI: guides/wiring-fastapi.md
      - Adoption checklist: guides/checklist.md
      - Worked examples: guides/examples/index.md
  - Reference:
      - reference/index.md
      - Tracing: reference/tracing.md
      - Problem: reference/problem.md
      - Exceptions: reference/exceptions.md
      - Concurrency: reference/concurrency.md
      - Pagination: reference/pagination.md
      - Merge patch: reference/merge_patch.md
      - Read mask: reference/read_mask.md
      - Transfer: reference/transfer.md
      - Operations: reference/operations.md
      - Idempotency: reference/idempotency.md
      - Health: reference/health.md
      - OpenAPI naming: reference/openapi.md
      - ASGI: reference/asgi.md
      - Auth: reference/auth.md
      - OIDC: reference/oidc.md
      - Conformance: reference/conformance.md
  - Changelog: changelog.md
