[project]
name = "rn-forge-cli"
version = "0.1.0"
description = "The shared command-line layer for rn-forge applications: Typer app factory, standard options, console and exit codes"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# Pinned direct URL, not a bare name: these packages are not on PyPI, and a
# release is a tag (kiln D46). `[tool.uv.sources]` below overrides this with
# the workspace checkout for local development only — the declaration here is
# what a consumer outside the workspace actually resolves.
dependencies = [
  "rn-forge-commons @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "rich>=15.0.0",
  "typer>=0.26.8",
]

[project.optional-dependencies]
testing = ["assertpy>=1.1", "pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.cli"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-cli = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-cli",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-cli",
]
