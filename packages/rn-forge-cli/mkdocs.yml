site_name: rn-forge-cli
site_description: The shared command-line layer for rn-forge applications
site_dir: .out/site
use_directory_urls: false

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - CLI: guides/cli.md
      - Declaring a CLI: guides/declaring.md
  - API Reference:
      - api/index.md
      - App: api/app.md
      - Options: api/options.md
      - Surface: api/surface.md
