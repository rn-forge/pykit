site_name: rn-forge-auth
site_description: Authentication primitives
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-auth/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mike:
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Authentication and authorization: guides/usage.md
  - Reference:
      - reference/index.md
      - Principal: reference/principal.md
      - Permissions: reference/permissions.md
      - Authorization: reference/authorization.md
      - Identity: reference/identity.md
      - Accounts: reference/accounts.md
      - Authorization context: reference/context.md
      - Authorization context cache: reference/context_cache.md
      - Resource policy: reference/policy.md
      - Session, transaction and replay stores: reference/stores.md
      - Return target: reference/redirects.md
      - Session body: reference/session_body.md
      - OIDC: reference/oidc.md
      - Redis: reference/redis.md
  - Changelog: changelog.md
