[project]
name = "rn-forge-data"
version = "0.1.0"
description = "Excel and tabular data helpers for Python programming"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# Pinned direct URL, not a bare name: these packages are not on PyPI, and
# each pin names its dependency's release tag (ADR-0004).
# `[tool.uv.sources]` below overrides this with the workspace checkout for
# local development only.
dependencies = [
  "rn-forge-commons @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "openpyxl>=3.1.5",
  "tablib[xlsx]>=3.8",
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.3"]

[project.urls]
Documentation = "https://rn-forge.github.io/pykit/packages/rn-forge-data/latest/"
Source = "https://github.com/rn-forge/pykit/tree/main/packages/rn-forge-data"
Changelog = "https://github.com/rn-forge/pykit/blob/main/packages/rn-forge-data/CHANGELOG.md"
Issues = "https://github.com/rn-forge/pykit/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.data"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-data = { workspace = true }

[tool.workspace-ci]
adapters = ["pandas"]

[tool.workspace-ci.smoke]
modules = ["rn_forge.data"]

[tool.workspace-ci.smoke.extras]
pandas = ["rn_forge.data.pandas"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "pandas-stubs>=3.0.5",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-data[pandas]",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-data[pandas]",
]
