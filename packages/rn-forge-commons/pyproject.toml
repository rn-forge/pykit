[project]
name = "rn-forge-commons"
version = "0.1.0"
description = "Shared, framework-agnostic utilities for Python programming"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.commons"

[tool.pytest.ini_options]
addopts = "-ra"
