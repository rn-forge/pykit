[project]
name = "rn-forge-commons"
version = "0.8.0"
description = "Shared, framework-agnostic utilities for Python programming"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
  "ruamel.yaml[oldlibyaml]>=0.19.1",
  "tomlkit>=0.15.0",
  "verboselogs>=1.7",
  "rich>=15.0.0",
  "dacite>=1.9.2",
]

[project.optional-dependencies]
json = ["python-json-logger>=4.0.0"]
structlog = ["structlog>=25.1.0"]
resilience = ["purgatory>=3.0.1", "stamina>=25.2.0", "httpx>=0.28"]
otel = ["opentelemetry-instrumentation-logging>=0.64b0"]
pydantic = ["pydantic>=2.12"]
markdown = ["markdown>=3.7", "markdown-it-py>=3.0"]
templates = ["jinja2>=3.1.6"]
testing = ["assertpy>=1.1", "pytest>=9.1.1"]
all = [
  "httpx>=0.28",
  "jinja2>=3.1.6",
  "markdown>=3.7",
  "markdown-it-py>=3.0",
  "opentelemetry-instrumentation-logging>=0.64b0",
  "purgatory>=3.0.1",
  "pydantic>=2.12",
  "python-json-logger>=4.0.0",
  "stamina>=25.2.0",
  "structlog>=25.1.0",
]

[project.urls]
Documentation = "https://rn-forge.github.io/pykit/packages/rn-forge-commons/latest/"
Source = "https://github.com/rn-forge/pykit/tree/main/packages/rn-forge-commons"
Changelog = "https://github.com/rn-forge/pykit/blob/main/packages/rn-forge-commons/CHANGELOG.md"
Issues = "https://github.com/rn-forge/pykit/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.commons"

[tool.uv.sources]
rn-forge-commons = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-commons[all]",
  "ruff>=0.17.3",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-commons[all]",
]
