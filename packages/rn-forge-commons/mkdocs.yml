site_name: rn-forge-commons
site_description: Shared utilities for the rn-forge-* Python package family
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-commons/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Logging: guides/logging.md
      - Console: guides/console.md
      - Resilience: guides/resilience.md
      - Config: guides/config.md
      - Data: guides/data.md
      - Processes and Tasks: guides/processes-and-tasks.md
  - Reference:
      - reference/index.md
      - Config: reference/config.md
      - Exceptions: reference/exceptions.md
      - Findings: reference/findings.md
      - Testing: reference/testing.md
      - Language:
          - Collections: reference/lang/collections.md
          - Dataclasses: reference/lang/dataclasses.md
          - Models: reference/lang/models.md
          - Reflection: reference/lang/reflection.md
          - Types: reference/lang/types.md
          - Utils: reference/lang/utils.md
      - Filesystem:
          - Blocks: reference/fs/blocks.md
          - Documents: reference/fs/documents.md
          - Hashing: reference/fs/hashing.md
          - Locks: reference/fs/locks.md
          - Paths: reference/fs/paths.md
      - Data:
          - Excel: reference/data/excel.md
          - Pandas: reference/data/pandas.md
      - Logging:
          - Logger: reference/logging/logger.md
          - StructLogger: reference/logging/structlog.md
      - Runtime:
          - Console: reference/runtime/console.md
          - Environment: reference/runtime/environment.md
          - Plugins: reference/runtime/plugins.md
          - Subprocess: reference/runtime/subprocess.md
          - Tasks: reference/runtime/tasks.md
      - Integration:
          - Token verification: reference/integration/auth.md
          - Messaging: reference/integration/messaging.md
          - Objects: reference/integration/objects.md
          - Resilience: reference/integration/resilience.md
          - Secrets: reference/integration/secrets.md
  - Changelog: changelog.md
