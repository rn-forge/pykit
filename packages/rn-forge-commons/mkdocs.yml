site_name: rn-forge-commons
site_description: Shared utilities for the rn-forge-* Python package family
site_dir: .out/site
use_directory_urls: false

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Logging: guides/logging.md
      - Resilience: guides/resilience.md
      - Config: guides/config.md
      - Data: guides/data.md
      - Processes and Tasks: guides/processes-and-tasks.md
  - API Reference:
      - api/index.md
      - Config: api/config.md
      - Exceptions: api/exceptions.md
      - Findings: api/findings.md
      - Testing: api/testing.md
      - Language:
          - Collections: api/lang/collections.md
          - Dataclasses: api/lang/dataclasses.md
          - Reflection: api/lang/reflection.md
          - Types: api/lang/types.md
          - Utils: api/lang/utils.md
      - Filesystem:
          - Blocks: api/fs/blocks.md
          - Documents: api/fs/documents.md
          - Hashing: api/fs/hashing.md
          - Locks: api/fs/locks.md
          - Paths: api/fs/paths.md
      - Data:
          - Excel: api/data/excel.md
          - Pandas: api/data/pandas.md
      - Logging:
          - Logging: api/logging/index.md
          - StructLogger: api/logging/structlog.md
      - Runtime:
          - Environment: api/runtime/environment.md
          - Plugins: api/runtime/plugins.md
          - Subprocess: api/runtime/subprocess.md
          - Tasks: api/runtime/tasks.md
      - Integration:
          - Messaging: api/integration/messaging.md
          - Objects: api/integration/objects.md
          - Resilience: api/integration/resilience.md
          - Secrets: api/integration/secrets.md
