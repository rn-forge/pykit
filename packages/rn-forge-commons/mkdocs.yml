site_name: rn-forge-commons
site_description: Shared utilities for the rn-forge-* Python package family
site_dir: .out/site
use_directory_urls: false

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Logging: guides/logging.md
      - Resilience: guides/resilience.md
      - Config: guides/config.md
      - Data: guides/data.md
      - Processes and Tasks: guides/processes-and-tasks.md
  - API Reference:
      - api/index.md
      - Collections: api/collections.md
      - Config: api/config.md
      - Dataclasses: api/dataclasses.md
      - Blocks: api/blocks.md
      - Documents: api/documents.md
      - Excel: api/excel.md
      - Exceptions: api/exceptions.md
      - Findings: api/findings.md
      - Logging: api/logging.md
      - Messaging: api/messaging.md
      - Objects: api/objects.md
      - Pandas: api/pandas.md
      - Plugins: api/plugins.md
      - Reflection: api/reflection.md
      - Resilience: api/resilience.md
      - Secrets: api/secrets.md
      - StructLogger: api/structlogger.md
      - Subprocess: api/subprocess.md
      - Tasks: api/tasks.md
      - Testing: api/testing.md
      - Utils: api/utils.md
