site_name: rn-forge-django
site_description: Opinionated Django/DRF integration layer built on rn-forge-commons and rn-forge-web
site_dir: .out/site
use_directory_urls: false
site_url: https://rn-forge.github.io/pykit/packages/rn-forge-django/
repo_url: https://github.com/rn-forge/pykit

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mike:
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: [., ../..]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Settings: guides/settings.md
      - Models: guides/models.md
      - Auth: guides/auth.md
      - DRF Views: guides/drf-views.md
      - Transfer: guides/transfer.md
      - OpenAPI and camelCase: guides/openapi.md
      - Messaging: guides/messaging.md
      - Fixtures: guides/fixtures.md
  - Reference:
      - reference/index.md
      - Settings: reference/settings.md
      - Models: reference/models.md
      - Exceptions: reference/exceptions.md
      - Messaging: reference/messaging.md
      - Celery: reference/celery.md
      - Fixtures: reference/fixtures.md
      - Urls and Views: reference/urls-and-views.md
      - Auth:
          - reference/auth/index.md
          - Credentials and Payload: reference/auth/credentials.md
          - Basic: reference/auth/basic.md
          - JWT: reference/auth/jwt.md
          - SAML: reference/auth/saml.md
          - DRF: reference/auth/drf.md
          - Principal (bearer and basic): reference/auth/principal.md
          - OIDC (JWKS bearer): reference/auth/oidc.md
      - DRF:
          - reference/drf/index.md
          - Views: reference/drf/views.md
          - Transfer: reference/drf/transfer.md
          - Routers: reference/drf/routers.md
          - Serializers: reference/drf/serializers.md
          - Exceptions: reference/drf/exceptions.md
          - Pagination: reference/drf/pagination.md
          - Idempotency: reference/drf/idempotency.md
          - Concurrency: reference/drf/concurrency.md
          - Casing: reference/drf/casing.md
          - OpenAPI: reference/drf/openapi.md
          - Utils: reference/drf/utils.md
  - Changelog: changelog.md
