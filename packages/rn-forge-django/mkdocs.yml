site_name: rn-forge-django
site_description: Opinionated Django/DRF integration layer built on rn-forge-commons and rn-forge-web
site_dir: .out/site
use_directory_urls: false

theme:
  name: material
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: auto
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Settings: guides/settings.md
      - Models: guides/models.md
      - Auth: guides/auth.md
      - DRF Views: guides/drf-views.md
      - OpenAPI and camelCase: guides/openapi.md
      - Messaging: guides/messaging.md
      - Fixtures: guides/fixtures.md
  - API Reference:
      - api/index.md
      - Settings: api/settings.md
      - Models: api/models.md
      - Exceptions: api/exceptions.md
      - Messaging: api/messaging.md
      - Celery: api/celery.md
      - Fixtures: api/fixtures.md
      - Urls and Views: api/urls-and-views.md
      - Auth:
          - api/auth/index.md
          - Credentials and Payload: api/auth/credentials.md
          - Basic: api/auth/basic.md
          - JWT: api/auth/jwt.md
          - SAML: api/auth/saml.md
          - DRF: api/auth/drf.md
          - Principal (bearer and basic): api/auth/principal.md
          - OIDC (JWKS bearer): api/auth/oidc.md
      - DRF:
          - api/drf/index.md
          - Views: api/drf/views.md
          - Serializers: api/drf/serializers.md
          - Exceptions: api/drf/exceptions.md
          - Pagination: api/drf/pagination.md
          - Idempotency: api/drf/idempotency.md
          - Concurrency: api/drf/concurrency.md
          - Casing: api/drf/casing.md
          - OpenAPI: api/drf/openapi.md
          - Utils: api/drf/utils.md
