[project]
name = "rn-forge-django"
version = "0.3.0"
description = "Opinionated Django/DRF integration layer built on rn-forge-commons and rn-forge-web"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "django>=6.0.7",
  # kiln D46 — pinned direct URLs; `[tool.uv.sources]` below is local development only.
  "rn-forge-commons @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "rn-forge-web @ git+https://github.com/rn-forge/pykit@rn-forge-web-v0.1.0#subdirectory=packages/rn-forge-web",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.17.1"]
# `rn_forge.django.drf.transfer` only: tabular export and import, batch create
# and delete. `[xlsx]` brings tablib and openpyxl, which `write_xlsx` also uses.
transfer = [
  "djangorestframework>=3.17.1",
  "django-import-export[xlsx]>=4.4.1",
]
# `fixtures.py` reads workbooks through `ExcelAdapter`, which needs pandas.
fixtures = [
  "rn-forge-commons[excel,pandas] @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
]
jwt = [
  "djangorestframework>=3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
]
# JWKS bearer auth for externally issued tokens. Separate from `jwt`, which is
# simplejwt against a local User. The authenticator itself is web's `auth`
# extra (`rn_forge.web.oidc`), which brings commons' `auth` extra with it.
oidc = [
  "djangorestframework>=3.17.1",
  "rn-forge-commons[auth] @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "rn-forge-web[auth] @ git+https://github.com/rn-forge/pykit@rn-forge-web-v0.1.0#subdirectory=packages/rn-forge-web",
]
celery = ["celery>=5.6.3"]
# drf-spectacular only. djangorestframework-camel-case was evaluated and not
# taken: its last release is 1.4.2 (2023-02), with classifiers stopping at
# Python 3.10 — casing lives in `rn_forge.django.drf.casing` instead.
openapi = [
  "djangorestframework>=3.17.1",
  "drf-spectacular>=0.30.0",
]
saml = [
  "djangorestframework>=3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
  "python3-saml>=1.16.0",
]
# `rn_forge.django.security` only, for the OWASP header preset
# (`rn_forge.web.security.API_SECURITY_HEADERS`, the `secure` library).
security = [
  "rn-forge-web[security] @ git+https://github.com/rn-forge/pykit@rn-forge-web-v0.1.0#subdirectory=packages/rn-forge-web",
]
# `rn_forge.django.cors` only. The application still owns its origins;
# `cors_settings` only carries `CORS_EXPOSE_HEADERS`.
cors = ["django-cors-headers>=4.9.0"]
# `rn_forge.django.tracing` only, called once before Django loads. Separate
# from `drf`: tracing is not DRF-specific, and `uv sync --extra drf` must not
# pull it in.
otel = ["opentelemetry-instrumentation-django>=0.65b0"]
all = [
  "celery>=5.6.3",
  "django-cors-headers>=4.9.0",
  "django-import-export[xlsx]>=4.4.1",
  "djangorestframework>=3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular>=0.30.0",
  "opentelemetry-instrumentation-django>=0.65b0",
  "python3-saml>=1.16.0",
  "rn-forge-commons[auth,excel,pandas] @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.5.0#subdirectory=packages/rn-forge-commons",
  "rn-forge-web[security] @ git+https://github.com/rn-forge/pykit@rn-forge-web-v0.1.0#subdirectory=packages/rn-forge-web",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.django"

[tool.uv.sources]
rn-forge-commons = { workspace = true }
rn-forge-django = { workspace = true }
rn-forge-web = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
markers = [
  "unit: fast isolated tests",
  "integration: tests that exercise database-backed behavior",
]

[dependency-groups]
dev = [
  "assertpy>=1.1",
  "django-stubs>=6.0.7",
  "opentelemetry-sdk>=1.44",
  # The PostgreSQL test job (RN_FORGE_DJANGO_TEST_DATABASE_URL); see tests/conftest.py.
  "psycopg[binary]>=3.3.5",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12.0",
  "pytest-randomly>=4.1.0",
  "rn-forge-django[all]",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
  "rn-forge-django[all]",
]
