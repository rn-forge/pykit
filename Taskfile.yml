# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The only entrypoint. Nobody — human, agent or CI — invokes `uv`, `pytest`,
# `ruff`, `pyright`, `mkdocs` or `kiln` directly; `kiln doctor`'s `ci-entrypoint`
# check enforces that for every workflow file.
#
# This file holds wrappers only: every task below is a list of calls into
# tasks/*.yml. Anything that shells out lives in the namespace file that owns
# it. Namespaces whose public name is already correct (docs:*) are reached
# through the include directly and carry no wrapper here.
#
# The vocabulary is fixed; see .rn-forge/kiln/standard.md.

env:
  # Keeping the uv cache inside the repo avoids competing with other checkouts
  # for a shared cache dir. Tasks that must not share it (packaging) override
  # this locally.
  UV_CACHE_DIR: .uv-cache

includes:
  quality: tasks/quality.yml
  python: tasks/python.yml
  kiln: tasks/kiln.yml
  docs: tasks/docs.yml
  workspace: tasks/workspace.yml
  ci: tasks/ci.yml

tasks:
  setup:
    desc: Install the project and its dev + docs dependency groups.
    cmds:
      - task: python:install

  validate:
    desc: The aggregate gate — lint, typecheck, test, docs build. Any failure fails.
    cmds:
      - task: workspace:banner
        vars: {STEP: "lint", N: 1, OF: 4}
      - task: lint
      - task: workspace:banner
        vars: {STEP: "typecheck", N: 2, OF: 4}
      - task: typecheck
      - task: workspace:banner
        vars: {STEP: "test", N: 3, OF: 4}
      - task: test
      - task: workspace:banner
        vars: {STEP: "docs:build", N: 4, OF: 4}
      - task: docs:build

  lint:
    desc: Every lint — Python, imports, Markdown, TOML and YAML formatting, kiln's checks (generated files, task layout, CI, dependencies, docs), workflow security, dependency vulnerabilities, dependency licences.
    cmds:
      - task: workspace:step
        vars: {STEP: "python:lint", N: 1, OF: 9}
      - task: python:lint
      - task: workspace:step
        vars: {STEP: "python:lint:imports", N: 2, OF: 9}
      - task: python:lint:imports
      - task: workspace:step
        vars: {STEP: "quality:lint:markdown", N: 3, OF: 9}
      - task: quality:lint:markdown
      - task: workspace:step
        vars: {STEP: "quality:lint:toml", N: 4, OF: 9}
      - task: quality:lint:toml
      - task: workspace:step
        vars: {STEP: "quality:lint:yaml", N: 5, OF: 9}
      - task: quality:lint:yaml
      - task: workspace:step
        vars: {STEP: "kiln:doctor", N: 6, OF: 9}
      - task: kiln:doctor
      - task: workspace:step
        vars: {STEP: "ci:lint:workflows", N: 7, OF: 9}
      - task: ci:lint:workflows
      - task: workspace:step
        vars: {STEP: "python:lint:audit", N: 8, OF: 9}
      - task: python:lint:audit
      - task: workspace:step
        vars: {STEP: "python:lint:licenses", N: 9, OF: 9}
      - task: python:lint:licenses

  format:
    desc: Format Python code, TOML, YAML and Markdown prose in place.
    cmds:
      - task: python:format
      - task: quality:format:markdown
      - task: quality:format:toml
      - task: quality:format:yaml

  typecheck:
    desc: Type-check each package in pyright strict mode.
    cmds:
      - task: python:typecheck

  test:
    desc: Run each package's pytest suite.
    cmds:
      - task: python:test

  test:coverage:
    desc: Run each package's tests with coverage, combined into one XML report (used by CI/Sonar).
    cmds:
      - task: python:test:coverage

  build:
    desc: Build one package's wheel and sdist into dist/ (pass -- <package>), or every package's.
    cmds:
      - task: python:build

  version:
    desc: Print one package's version (pass -- <package>), or every package's.
    cmds:
      - task: python:version

  clean:
    desc: Remove build outputs, caches, and the rendered docs site.
    cmds:
      - task: workspace:clean
