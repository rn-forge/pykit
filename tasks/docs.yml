# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The documentation site. A public namespace: `task docs:serve` is something a
# developer runs directly while writing prose, so these three verbs are the only
# non-root public tasks the vocabulary allows (see .rn-forge/kiln/standard.md).

vars:
  KILN: 'uvx --from "rn-forge-kiln @ git+https://github.com/rn-forge/kiln@feature/v1" kiln'

tasks:
  build:
    desc: Build the MkDocs site into .docs-site/ (or $1 when given).
    cmds:
      - uv run --group docs mkdocs build --strict{{if .CLI_ARGS}} --site-dir "{{.CLI_ARGS}}"{{end}}
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-commons/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-cli/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-django/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-fastapi/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-sqlalchemy/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-tooling/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-web/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-devops/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-data/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc
      - |
        site=$(mktemp -d) && uv run --group docs mkdocs build --strict -f packages/rn-forge-auth/mkdocs.yml --site-dir "$site"; rc=$?; rm -rf "$site"; exit $rc

  serve:
    desc: Serve the docs site locally with live reload on http://127.0.0.1:8080.
    cmds:
      - uv run --group docs mkdocs serve -a 127.0.0.1:8080

  generate:
    desc: Regenerate the docs' derived regions.
    cmds:
      - '{{.KILN}} docs-generate .'
