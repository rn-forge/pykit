# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# kiln's own checks on this repository — the files it generates and the
# standard's rules on the rest — run once, by `lint`. `doctor` is internal;
# `diff` and `apply` are public, reached as `kiln:diff` and `kiln:apply`, and
# pass their arguments through (`task kiln:diff -- --artifact Taskfile.yml`).

vars:
  KILN: 'uvx --from "rn-forge-kiln @ git+https://github.com/rn-forge/kiln@feature/v1" kiln'

tasks:
  doctor:
    desc: Run kiln's checks on this repository — generated files, task layout, CI, dependencies, docs.
    internal: true
    cmds:
      - cmd: '{{.KILN}} doctor .'
        if: '[ -z "{{.KILN_DOCTOR_FULL}}" ]'
      - cmd: '{{.KILN}} doctor . --full'
        if: '[ -n "{{.KILN_DOCTOR_FULL}}" ]'

  diff:
    desc: Show every generated file that differs from a fresh render, writing nothing. Pass --artifact <key or path> after `--` to limit it to one.
    cmds:
      - '{{.KILN}} diff {{.CLI_ARGS}}'

  apply:
    desc: Re-render the generated files from .rn-forge/kiln/config.toml. Pass --dry-run, or --force <path> to overwrite a drifted file, after `--`.
    cmds:
      - '{{.KILN}} apply {{.CLI_ARGS}}'
