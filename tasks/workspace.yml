# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# Cleanup of every toolchain's outputs and caches, reached through `task clean`,
# the banner that `validate` prints between its steps, and the lighter
# marker that `lint` prints before each of its.

tasks:
  banner:
    desc: Print a banner naming the step that follows (STEP), numbered N of OF.
    internal: true
    silent: true
    requires:
      vars: [STEP, N, OF]
    cmds:
      - printf '\n========================================================================\n### [%s/%s] %s\n========================================================================\n' '{{.N}}' '{{.OF}}' '{{.STEP}}'

  step:
    desc: Print a one-line marker naming the sub-step that follows (STEP), numbered N of OF.
    internal: true
    silent: true
    requires:
      vars: [STEP, N, OF]
    cmds:
      - printf '\n--- [%s/%s] %s\n' '{{.N}}' '{{.OF}}' '{{.STEP}}'

  clean:
    desc: Remove build outputs, tool caches, and the rendered docs site.
    internal: true
    cmds:
      - rm -rf dist build .docs-site .tmp .pytest_cache .ruff_cache .uv-cache .import_linter_cache coverage.xml
      - find . -type d -name __pycache__ -not -path './.venv/*' -exec rm -rf {} +
