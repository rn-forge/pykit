# Seeded by kiln — this file is yours.
#
# yamlfmt formats every YAML file git lists — tracked and untracked, less what
# `.gitignore` ignores; `task lint` checks it and `task format` applies it.
# `exclude` is for files git does list but this repo does not format: a package
# manager writes `pnpm-lock.yaml`, so it is left alone.
doublestar: true
exclude:
  - "**/pnpm-lock.yaml"
formatter:
  type: basic
  retain_line_breaks_single: true
  scan_folded_as_literal: true
