[project]
name = "pykit"
version = "0.1.0"
description = "Development kit for python programming"
readme = "README.md"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/rn-forge-commons",
    "packages/rn-forge-cli",
    "packages/rn-forge-django",
    "packages/rn-forge-fastapi",
    "packages/rn-forge-sqlalchemy",
    "packages/rn-forge-tooling",
    "packages/rn-forge-web",
    "packages/rn-forge-devops",
    "packages/rn-forge-data",
    "packages/rn-forge-auth",
]

[tool.uv.sources.rn-forge-commons]
workspace = true

[tool.uv.sources.rn-forge-cli]
workspace = true

[tool.uv.sources.rn-forge-django]
workspace = true

[tool.uv.sources.rn-forge-fastapi]
workspace = true

[tool.uv.sources.rn-forge-sqlalchemy]
workspace = true

[tool.uv.sources.rn-forge-tooling]
workspace = true

[tool.uv.sources.rn-forge-web]
workspace = true

[tool.uv.sources.rn-forge-devops]
workspace = true

[tool.uv.sources.rn-forge-data]
workspace = true

[tool.uv.sources.rn-forge-auth]
workspace = true

[tool.pyright]
ignore = [
    "tests",
    "**/tests",
    # The two framework examples in rn-forge-web's guides are documentation:
    # they import Django/DRF and FastAPI, which this workspace deliberately does not
    # install for that package. The framework-free asgi_app.py beside them is NOT
    # excluded — it is executed by the test suite and is typechecked like any source.
    "packages/rn-forge-web/docs/guides/examples/django_app.py",
    "packages/rn-forge-web/docs/guides/examples/fastapi_app.py",
]
include = ["packages"]
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages"]
markers = [
    "unit: fast isolated tests",
    "integration: tests that exercise database-backed behavior",
    "postgres: needs a PostgreSQL DSN in RN_FORGE_TEST_POSTGRES_DSN",
    "broker: needs Keycloak at RN_FORGE_AUTH_KEYCLOAK_URL (rn-forge-auth)",
    "scaffold: installs built wheels into a scaffolded application (slow)",
    "security_control: demonstrates the security control with the given rn_forge.auth.conformance case ID",
]

[tool.workspace-ci.suites]
# Each suite is its own job over the whole workspace. Package jobs deselect the
# scaffold tests through each member's own pytest addopts.
scaffold = ["-q", "-m", "scaffold"]

[tool.ruff.lint]
# Bandit's checks, including the Django ones (S308, S703).
extend-select = ["S"]

[tool.ruff.lint.isort]
# ruff otherwise sorts these frameworks as first-party, after the rn_forge subpackages that share their names.
known-third-party = ["django", "fastapi", "sqlalchemy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# kiln's four, then the Bandit rules that fixtures, /tmp paths, local-server urlopen and scaffold subprocess legitimately trip in tests.
"**/tests/*" = [
    "ANN",
    "D",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "S107",
    "S108",
    "S310",
    "S603",
    "S607",
]
# Repository tooling outside packages/, which is what the source scan covers.
"conftest.py" = ["S"]

[dependency-groups]
dev = [
    { include-group = "workspace" },
    "actionlint-py>=1.7",
    "aiosqlite>=0.21",
    "alembic>=1.20.1",
    "assertpy>=2.35",
    "asyncpg>=0.30",
    "coverage[toml]>=7.6",
    "django-stubs>=6.1.2",
    "google-yamlfmt>=0.21.0",
    "import-linter>=2.15",
    "opentelemetry-instrumentation-asgi>=0.65b0",
    "opentelemetry-sdk>=1.44",
    "pandas-stubs>=3.0.5",
    "pip-audit>=2.10",
    "pip-licenses>=5",
    "psycopg[binary]>=3.3.5",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1",
    "pytest-django>=4.12.0",
    "pytest-randomly>=4.1.0",
    "rn-forge-data[pandas]",
    "ruff>=0.17.1",
    "taplo>=0.9",
    "types-authlib>=1.8.0",
    "zizmor>=1.31",
]
docs = [
    "mdformat>=1.0.0",
    "mdformat-front-matters>=2.0.0",
    "mdformat-gfm>=0.4",
    "mdformat-mkdocs>=5.3.0",
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6",
    "mkdocs-monorepo-plugin>=1.1",
    "mkdocstrings[python]>=1.0.8",
]
workspace = [
    "rn-forge-auth[oidc]",
    "rn-forge-cli",
    "rn-forge-commons[all]",
    "rn-forge-devops",
    "rn-forge-django[all]",
    "rn-forge-fastapi[sse,transfer]",
    "rn-forge-sqlalchemy",
    "rn-forge-tooling",
    "rn-forge-web[security]",
]
