name: Workspace setup
description: Install uv and optionally sync the workspace.
inputs:
  sync:
    description: Sync every workspace package and extra.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
    - name: uv sync
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      run: uv sync --all-packages --all-extras --locked
