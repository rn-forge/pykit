name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  # An import contract that only passes on a developer's machine is not a
  # contract. This gates everything else: the three-layer split is the shape
  # the packages are built around, and a break in it invalidates the rest.
  import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-extras --locked

      - name: lint-imports
        run: uv run --no-sync lint-imports

  # A package job runs when its files changed or a package it depends on is
  # selected, so a dependent is always tested against its changed prerequisite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      commons: ${{ steps.select.outputs.commons }}
      cli: ${{ steps.select.outputs.cli }}
      tooling: ${{ steps.select.outputs.tooling }}
      web: ${{ steps.select.outputs.web }}
      django: ${{ steps.select.outputs.django }}
      fastapi: ${{ steps.select.outputs.fastapi }}
      sqlalchemy: ${{ steps.select.outputs.sqlalchemy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: python3 .github/scripts/changed_packages.py "$BASE" >> "$GITHUB_OUTPUT"

  commons-ci:
    needs: [import-boundaries, changes]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.commons == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-commons
      package-dir: packages/rn-forge-commons

  cli-ci:
    needs: [import-boundaries, changes, commons-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.cli == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-cli
      package-dir: packages/rn-forge-cli

  tooling-ci:
    needs: [import-boundaries, changes, commons-ci, cli-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.tooling == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-tooling
      package-dir: packages/rn-forge-tooling

  web-ci:
    needs: [import-boundaries, changes, commons-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.web == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-web
      package-dir: packages/rn-forge-web

  django-ci:
    needs: [import-boundaries, changes, commons-ci, web-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.django == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-django
      package-dir: packages/rn-forge-django

  # sqlite has no row locks, so the outbox relay's skip_locked claim and the
  # real-sequence path of SequenceGenerator are only proven here.
  django-postgres:
    needs: [import-boundaries, changes]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.django == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rnforge
          POSTGRES_PASSWORD: rnforge
          POSTGRES_DB: rnforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rnforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RN_FORGE_DJANGO_TEST_DATABASE_URL: postgresql://rnforge:rnforge@localhost:5432/rnforge
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-extras --locked

      - name: pytest (PostgreSQL)
        run: uv run --directory packages/rn-forge-django --package rn-forge-django --no-sync pytest -m "not scaffold"

  # Every other job syncs --all-extras, which hides an extra that forgets a
  # dependency another extra brings. Each extra is installed alone, from the
  # built wheel's metadata, into a clean venv and imported.
  django-extras:
    needs: [import-boundaries, changes]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.django == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [base, drf, fixtures, jwt, oidc, celery, openapi, saml]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build wheels
        run: |
          for package in rn-forge-commons rn-forge-web rn-forge-django; do
            uv build --package "$package" --wheel --out-dir dist
          done

      - name: Install and import the ${{ matrix.extra }} extra
        run: uv run --no-project --with packaging python .github/scripts/check_django_extra.py ${{ matrix.extra }}

  fastapi-ci:
    needs: [import-boundaries, changes, commons-ci, web-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.fastapi == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-fastapi
      package-dir: packages/rn-forge-fastapi

  sqlalchemy-ci:
    needs: [import-boundaries, changes, web-ci, fastapi-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.sqlalchemy == 'true' }}
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-sqlalchemy
      package-dir: packages/rn-forge-sqlalchemy

  # Workspace tests import from source; these install wheels built from this
  # commit into a clean venv, the way a consumer would.
  scaffold:
    needs: [import-boundaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-extras --locked

      - name: pytest (scaffold)
        run: uv run --no-sync pytest -q -m scaffold

  sonar:
    needs: [commons-ci, cli-ci, tooling-ci, web-ci, django-ci, django-postgres, django-extras, fastapi-ci, sqlalchemy-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-extras --locked

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=rn_forge.commons --cov=rn_forge.cli
          --cov=rn_forge.tooling --cov=rn_forge.web --cov=rn_forge.django
          --cov=rn_forge.fastapi --cov=rn_forge.sqlalchemy
          --cov-report=xml:coverage.xml
          packages

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docs:
    needs: [commons-ci, cli-ci, tooling-ci, web-ci, django-ci, django-postgres, django-extras, fastapi-ci, sqlalchemy-ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes gh-pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # Tags pushed with GITHUB_TOKEN start no workflow, so the tags this run's
      # package jobs created are found here and each package's site is deployed
      # to gh-pages, which stores the versions between runs.
      - name: Deploy versioned package sites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(git tag --points-at "$GITHUB_SHA"); do
            package="${tag%-v*}"
            [ -f "packages/$package/mkdocs.yml" ] || continue
            version="${tag##*-v}"
            prefix="packages/$package"
            config="$prefix/mkdocs.yml"
            first=$(uv run --group docs mike list --deploy-prefix "$prefix" -F "$config" 2>/dev/null | wc -l)
            uv run --group docs mike deploy --deploy-prefix "$prefix" -F "$config" \
              --alias-type copy --update-aliases --push "${version%.*}" latest
            if [ "$first" -eq 0 ]; then
              uv run --group docs mike set-default --deploy-prefix "$prefix" -F "$config" --push latest
            fi
          done

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

      - name: Add versioned package sites
        run: |
          if git fetch origin gh-pages; then
            git archive FETCH_HEAD packages | tar -x -C .out/site
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
