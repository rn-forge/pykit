name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  commons-ci:
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-commons
      package-dir: packages/rn-forge-commons

  django-ci:
    uses: ./.github/workflows/_package-ci.yml
    permissions:
      contents: write
    with:
      package-name: rn-forge-django
      package-dir: packages/rn-forge-django

  sonar:
    needs: [commons-ci, django-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docs:
    needs: [commons-ci, django-ci]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --group docs mkdocs build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
