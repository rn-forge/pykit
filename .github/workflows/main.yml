name: CICD

# Every package list below comes from the `plan` job, which reads the uv
# workspace's manifests with the rn-forge-devops package (`uv run rn-forge-devops`).
# No job names a package.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger
    inputs:
      testpypi:
        type: boolean
        default: false
        description: Upload every package to TestPyPI; no tags or releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # An import contract that only passes on a developer's machine is not a
  # contract. This gates every package check.
  import-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: lint-imports
        if: hashFiles('.importlinter') != ''
        run: uv run --no-sync lint-imports

      - name: adapters
        run: uv run --no-sync rn-forge-devops adapters

  # Audits every locked package, extra and group. Workspace members are not on
  # PyPI, so the export omits them; --no-deps because the lock is already resolved.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      - name: pip-audit
        run: |
          uv export --frozen --all-packages --all-extras --all-groups \
            --no-emit-workspace --no-hashes --no-annotate --no-header -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

  # Workspace members carry no licence metadata, so they are left out of the
  # environment. --fail-on is partial-match for names ("GNU General Public
  # License" does not match the Lesser variant) and exact for SPDX ids, because
  # a partial "GPL-3.0" would also match "LGPL-3.0-only".
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      - name: pip-licenses
        run: |
          uv sync --frozen --all-packages --all-extras --all-groups --no-install-workspace
          uvx pip-licenses==5.5.5 --python .venv/bin/python --format=json --output-file "$RUNNER_TEMP/licenses.json"
          # text-unidecode (via python-slugify) is "Artistic License or GPL"; pykit uses it under Artistic.
          uvx pip-licenses==5.5.5 --python .venv/bin/python --partial-match --ignore-packages text-unidecode \
            --fail-on "GNU General Public License;GNU Affero;Server Side Public License;AGPL;SSPL"
          uvx pip-licenses==5.5.5 --python .venv/bin/python --fail-on "UNKNOWN;GPL;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: licenses
          path: ${{ runner.temp }}/licenses.json
          if-no-files-found: ignore

  # The release binary, not gitleaks-action, which needs a paid licence for
  # organisations. Scans every commit reachable from the checkout.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .

  internal-ranges:
    permissions:
      contents: read
    uses: ./.github/workflows/internal-ranges.yml

  # Selects the packages whose files changed plus every package that depends on
  # one, and emits each job's matrix.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release-order: ${{ steps.plan.outputs.release-order }}
      packages: ${{ steps.plan.outputs.packages }}
      postgres: ${{ steps.plan.outputs.postgres }}
      redis: ${{ steps.plan.outputs.redis }}
      smoke: ${{ steps.plan.outputs.smoke }}
      suites: ${{ steps.plan.outputs.suites }}
      pytest-args: ${{ steps.plan.outputs.pytest-args }}
      cov-args: ${{ steps.plan.outputs.cov-args }}
      test-paths: ${{ steps.plan.outputs.test-paths }}
      sonar-sources: ${{ steps.plan.outputs.sonar-sources }}
      sonar-tests: ${{ steps.plan.outputs.sonar-tests }}
      sonar: ${{ steps.plan.outputs.sonar }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            BASE=$(gh run list --workflow main.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          uv run rn-forge-devops plan "$BASE" | tee -a "$GITHUB_OUTPUT"

  # Each passing check entry uploads an `ok-<marker>` artifact; `release` tags a
  # package only when all of its markers exist.
  verify:
    name: verify (${{ matrix.name }})
    needs: [import-boundaries, plan]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: ruff check
        run: uv run --directory ${{ matrix.dir }} --package ${{ matrix.name }} --no-sync ruff check

      - name: pyright
        run: uv run --directory ${{ matrix.dir }} --package ${{ matrix.name }} --no-sync pyright

      - name: pytest
        run: uv run --directory ${{ matrix.dir }} --package ${{ matrix.name }} --no-sync pytest ${{ needs.plan.outputs.pytest-args }}

      - run: mkdir ok && touch "ok/${{ matrix.name }}.verify"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.verify
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.postgres]`: its tests again, with the
  # DSN in the environment variable it names.
  postgres:
    name: postgres (${{ matrix.name }})
    needs: [import-boundaries, plan]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.postgres != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.postgres) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: pytest (PostgreSQL)
        run: |
          export ${{ matrix.env }}=postgresql://ci:ci@localhost:5432/ci
          uv run --directory ${{ matrix.dir }} --package ${{ matrix.name }} --no-sync pytest ${{ needs.plan.outputs.pytest-args }}

      - run: mkdir ok && touch "ok/${{ matrix.name }}.postgres"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.postgres
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.redis]`: its tests again, with the
  # URL in the environment variable it names.
  redis:
    name: redis (${{ matrix.name }})
    needs: [import-boundaries, plan]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.redis != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.redis) }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: pytest (Redis)
        run: |
          export ${{ matrix.env }}=redis://localhost:6379/0
          uv run --directory ${{ matrix.dir }} --package ${{ matrix.name }} --no-sync pytest ${{ needs.plan.outputs.pytest-args }}

      - run: mkdir ok && touch "ok/${{ matrix.name }}.redis"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.redis
          path: ok/
          retention-days: 1

  # Every other job syncs --all-extras, which hides an extra that forgets a
  # dependency another extra brings. Each extra is installed alone, from the
  # built wheel's metadata, into a clean venv and imported.
  smoke:
    name: smoke (${{ matrix.marker }})
    needs: [import-boundaries, plan]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.smoke != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      - name: Install and import
        run: uv run rn-forge-devops smoke ${{ matrix.name }} "${{ matrix.extra }}"

      - run: mkdir ok && touch "ok/${{ matrix.marker }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.marker }}
          path: ok/
          retention-days: 1

  # Workspace-wide pytest runs from the root `[tool.workspace-ci.suites]`.
  suites:
    name: suite (${{ matrix.name }})
    needs: [import-boundaries, plan]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.suites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: pytest
        run: uv run --no-sync pytest ${{ matrix.args }}

  # Tags created with GITHUB_TOKEN start no workflow, so every release is created
  # here, prerequisites first. A failed check blocks its package and every
  # selected package that depends on it; the rest still release.
  release:
    needs: [import-boundaries, plan, verify, postgres, redis, smoke]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.plan.outputs.release-order != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing and artifact attestations
      attestations: write
    # An empty name means no environment, so pull requests build without approval.
    environment: ${{ (github.event_name == 'push' && github.ref_name == 'main') && 'pypi' || (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ok-*
          merge-multiple: true
          path: ok/

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          TESTPYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}
          SELECTED: ${{ needs.plan.outputs.release-order }}
        run: |
          set -euo pipefail
          on_index() { curl -fsS -o /dev/null "https://$1/pypi/$2/$3/json"; }
          # The SBOM lists the package's locked third-party dependencies, kept out of
          # dist/ so neither twine nor uv publish sees it.
          sbom() {
            mkdir -p "$GITHUB_WORKSPACE/sbom"
            uv export --directory "$1" --frozen --package "$2" --no-dev --all-extras --no-emit-workspace --no-hashes --no-header --no-annotate -o "$RUNNER_TEMP/$2.txt"
            uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements "$RUNNER_TEMP/$2.txt" --of JSON -o "$GITHUB_WORKSPACE/sbom/$2-$3.cdx.json"
          }
          mapfile -t names < <(jq -r '.[]' <<<"$SELECTED")
          releasable="$(uv run rn-forge-devops releasable ok "${names[@]}")"
          for name in $releasable; do
            version="$(uv version --package "$name" --short)"
            tag="$name-v$version"
            if [ "$PUBLISH" != true ]; then
              uv build --package "$name" --out-dir "dist/$name"
              uvx twine@7.0.0 check --strict dist/"$name"/*
              if [ "$TESTPYPI" = true ]; then
                if on_index test.pypi.org "$name" "$version"; then
                  echo "$name $version is already on TestPyPI, skipping."
                else
                  uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/"$name"/*
                fi
              fi
              continue
            fi
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$draft" = false ]; then
              echo "Release $tag is already published, skipping."
              continue
            fi
            remote_tag=$(git ls-remote --tags origin "refs/tags/$tag")
            if [ -n "$remote_tag" ]; then
              git fetch --no-tags origin "refs/tags/$tag"
              worktree=$(mktemp -d)
              git worktree add --detach "$worktree" FETCH_HEAD
              uv build --directory "$worktree" --package "$name" --out-dir "$GITHUB_WORKSPACE/dist/$name"
              sbom "$worktree" "$name" "$version"
              git worktree remove "$worktree"
            else
              uv build --package "$name" --out-dir "dist/$name"
              sbom . "$name" "$version"
            fi
            uvx twine@7.0.0 check --strict dist/"$name"/*
            echo "$name $version ${draft:-none} ${remote_tag:+existing}" >> "$RUNNER_TEMP/built.txt"
          done
          if [ -s "$RUNNER_TEMP/built.txt" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      # A failed attestation stops the job before anything is uploaded or released.
      - name: Attest build provenance
        if: ${{ steps.build.outputs.built == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*/*
            sbom/*

      # uv publish uploads the *.publish.attestation files beside each dist.
      - name: Attest PyPI publish
        if: ${{ steps.build.outputs.built == 'true' }}
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/*/*

      - name: Upload and release
        if: ${{ steps.build.outputs.built == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          on_index() { curl -fsS -o /dev/null "https://$1/pypi/$2/$3/json"; }
          while read -r -u 3 name version draft existing; do
            tag="$name-v$version"
            # Upload before the GitHub release, so a published release implies the version is on PyPI.
            if on_index pypi.org "$name" "$version"; then
              echo "$name $version is already on PyPI, skipping upload."
            else
              uv publish --trusted-publishing always dist/"$name"/*
            fi
            notes=$(mktemp)
            uv run rn-forge-devops notes "packages/$name/CHANGELOG.md" "$version" > "$notes"
            if [ "$draft" = true ]; then
              gh release delete "$tag" --yes
            fi
            if [ -n "$existing" ]; then
              gh release create "$tag" dist/"$name"/*.whl dist/"$name"/*.tar.gz "sbom/$name-$version.cdx.json" --verify-tag --title "$name v$version" --latest=false --notes-file "$notes"
            else
              gh release create "$tag" dist/"$name"/*.whl dist/"$name"/*.tar.gz "sbom/$name-$version.cdx.json" --target "$GITHUB_SHA" --title "$name v$version" --latest=false --notes-file "$notes"
            fi
          done 3< "$RUNNER_TEMP/built.txt"

  sonar:
    needs: [plan, verify, postgres, redis, smoke]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.sonar == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run rn-forge-devops sonar-target >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        run: uv run pytest ${{ needs.plan.outputs.cov-args }} --cov-report=xml:coverage.xml ${{ needs.plan.outputs.test-paths }}

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=${{ needs.plan.outputs.sonar-sources }}
            -Dsonar.tests=${{ needs.plan.outputs.sonar-tests }}
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.branch-arg }}

  # Package checks resolve internal dependencies from the workspace, which
  # never proves the PyPI upload installs on its own.
  external-install:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      - name: Verify remote tags and clean installs
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          uv run rn-forge-devops released | while read -r name _ module version; do
            tag="$name-v$version"
            git fetch --no-tags origin "refs/tags/$tag"
            uv venv -q "$tmp/$name"
            installed=false
            for _ in $(seq 10); do
              if VIRTUAL_ENV="$tmp/$name" uv pip install -q --refresh "$name==$version"; then
                installed=true
                break
              fi
              sleep 30 # PyPI's CDN lags the upload
            done
            [ "$installed" = true ]
            "$tmp/$name/bin/python" -c "import $module"
          done

  # Runs on a push with no package change too, when `release` is skipped.
  docs:
    needs: [import-boundaries, plan, release]
    if: ${{ !cancelled() && needs.import-boundaries.result == 'success' && needs.release.result != 'failure' && needs.plan.outputs.docs == 'true' && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write # mike pushes gh-pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          sync: "false"

      # Each package tagged at this commit gets its site deployed to gh-pages,
      # which stores the versions between runs.
      - name: Deploy versioned package sites
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run rn-forge-devops released | while read -r _ dir _ version; do
            config="$dir/mkdocs.yml"
            [ -f "$config" ] || continue
            first=$(uv run --group docs mike list --deploy-prefix "$dir" -F "$config" 2>/dev/null | wc -l)
            uv run --group docs mike deploy --deploy-prefix "$dir" -F "$config" \
              --alias-type copy --update-aliases --push "${version%.*}" latest
            if [ "$first" -eq 0 ]; then
              uv run --group docs mike set-default --deploy-prefix "$dir" -F "$config" --push latest
            fi
          done

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

      - name: Add versioned package sites
        run: |
          if git fetch origin gh-pages; then
            git archive FETCH_HEAD packages | tar -x -C .out/site
          fi

      - uses: ./.github/actions/package-index
        env:
          SITE_DIR: .out/site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  umbrella-release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [import-boundaries]
    permissions:
      contents: write
    uses: ./.github/workflows/umbrella-release.yml

  # The one required status check: matrix job names change with the packages.
  ci-ok:
    if: ${{ always() }}
    needs: [import-boundaries, dependency-audit, licenses, secret-scan, internal-ranges, plan, verify, postgres, redis, smoke, suites, release, sonar, external-install, umbrella-release, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
