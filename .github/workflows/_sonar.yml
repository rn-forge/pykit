# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: The SonarQube Cloud token
        required: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # A push or dispatch names its branch (main, by the job's `if`), so the
      # analysis lands on it explicitly. A pull request keeps the scanner's own
      # detection. A tag has no branch to analyse.
      - name: Resolve the analysis target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: task ci:sonar:target >> "$GITHUB_OUTPUT"

      - name: Test with coverage
        run: task test:coverage

      # `sonar.qualitygate.wait` is what makes the gate a gate: without it the
      # job succeeds on *submitting* the analysis, and a release can ship while
      # Sonar is still deciding it failed.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.branch-arg }}
