name: Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: uv workspace member name, e.g. rn-forge-commons
        required: true
        type: string
      package-dir:
        description: Path to the package directory, e.g. packages/rn-forge-commons
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --all-packages --all-extras --locked

      - name: ruff check
        run: uv run --directory ${{ inputs.package-dir }} --package ${{ inputs.package-name }} --no-sync ruff check

      - name: pyright
        run: uv run --directory ${{ inputs.package-dir }} --package ${{ inputs.package-name }} --no-sync pyright

      - name: pytest
        run: uv run --directory ${{ inputs.package-dir }} --package ${{ inputs.package-name }} --no-sync pytest

  check-version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Read version
        id: version
        run: |
          version="$(uv version --package ${{ inputs.package-name }} --short)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check if version has been released
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ]; then
            printf 'should-release=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${{ inputs.package-name }}-v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            printf '%s\n' "Tag $tag already exists, skipping build and release."
            printf 'should-release=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-release=true\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build
        run: uv build --package ${{ inputs.package-name }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.package-name }}
          path: dist/
          retention-days: 7

  publish:
    needs: [check-version, build]
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.package-name }}
          path: dist/

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          tag="${{ inputs.package-name }}-v${{ needs.check-version.outputs.version }}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.package-name }}-v${{ needs.check-version.outputs.version }}
          name: ${{ inputs.package-name }} v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: dist/*
