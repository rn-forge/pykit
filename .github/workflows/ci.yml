# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → plan → test, integration, smoke, suites → sonar → release → verify-release, docs.
#
# validate: the repository-wide checks (lint, adapters, docs build), once.
# plan:     reads the uv workspace and selects the changed packages and their
#           dependents, as the outputs every later job reads.
# test:     one job per selected package — lint, typecheck and test that member.
# integration, smoke, suites: the jobs a package or the workspace declares —
#           tests against the service containers a package declares, one extra
#           installed alone, workspace-wide pytest.
# sonar:    the scan, once test, integration and smoke have passed.
# release:  the selected packages whose checks all passed, in dependency order,
#           each on its own `<package>-v<version>` tag.
# verify-release: installs what was published, from PyPI, outside the repository, and imports it.
# docs:     deploys each released package's versioned site and the root site to Pages once the barrier and the release stages have passed.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/pytest/ruff/pyright/mkdocs/kiln directly. kiln runs
# here only as the version `[kiln] ref` pins, read-only, through
# `task validate`: it checks the tree against the committed
# .rn-forge/kiln/state.json and never runs `kiln apply`.
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      testpypi:
        type: boolean
        default: false
        description: Upload every package to TestPyPI; no tags or releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Validate
        run: task lint
        env:
          KILN_DOCTOR_FULL: ${{ ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') && '1' || '' }}

      - name: Check adapters
        run: task ci:adapters

      - name: Build docs
        run: task docs:build

  # Fails a pull request that adds a dependency with a known vulnerability, from
  # GitHub's dependency graph. Skipped on a push, which `ci-ok` treats as a pass.
  dependency-review:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Scans the full git history for leaked secrets (gitleaks, `task ci:secret-scan`). A pull
  # request from a fork cannot be scanned with this checkout, so it is skipped, which
  # `checks-ok` treats as a pass.
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the history for secrets
        run: task ci:secret-scan

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release-order: ${{ steps.plan.outputs.release-order }}
      packages: ${{ steps.plan.outputs.packages }}
      integration: ${{ steps.plan.outputs.integration }}
      smoke: ${{ steps.plan.outputs.smoke }}
      suites: ${{ steps.plan.outputs.suites }}
      pytest-args: ${{ steps.plan.outputs.pytest-args }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check internal ranges
        run: task ci:internal-ranges

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: task ci:plan >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          PYTEST_ARGS: ${{ needs.plan.outputs.pytest-args }}
        run: task ci:test -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.name }}.test"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.test
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.integration.<service>]` tables: its
  # tests again, with the service containers `task ci:integration` starts around
  # them. A job's `services` cannot vary with the matrix leg, so the task starts
  # them.
  integration:
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.integration != '[]' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_integration.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      matrix: ${{ needs.plan.outputs.integration }}

  # Every other job syncs everything, which hides an extra that forgets a
  # dependency another extra brings. Each extra is installed alone, from the
  # built wheel's metadata, into a clean venv and imported.
  smoke:
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.smoke != '[]' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      matrix: ${{ needs.plan.outputs.smoke }}

  # Workspace-wide pytest runs from the root `[tool.workspace-ci.suites]`.
  suites:
    name: suite (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.suites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Run the suite
        env:
          SUITE_ARGS: ${{ matrix.args }}
        run: task ci:suites

  sonar:
    needs: [validate, test, integration, smoke, suites]
    # The scan runs on a same-repository pull request and on main, nowhere else.
    # A fork's pull request cannot see SONAR_TOKEN, and SonarQube Cloud's free
    # plan keeps no readable result for any other branch, so the quality-gate
    # wait fails there. Validation stays required; the scan is skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_sonar.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Tags created with GITHUB_TOKEN start no workflow, so every release is created
  # here, prerequisites first, only on a push to the default branch and after
  # `checks-ok`. A failed check of any kind blocks the whole run.
  release:
    needs: [plan, checks-ok]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && needs.plan.outputs.release-order != '[]' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.testpypi)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.testpypi && 'testpypi' || 'pypi' }}
    # The provenance step's `if:` reads this; a step's own `env:` is not in scope there.
    env:
      TESTPYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the check markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ok-*
          merge-multiple: true
          path: ok/

      - name: Build releases
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TESTPYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}
          SELECTED: ${{ needs.plan.outputs.release-order }}
        run: task ci:release:build

      # Attested before anything is published, because the release, not the
      # tag, is the record: a failure here leaves nothing published, and a
      # rerun attests again. Skipped when every package was already released.
      - name: Generate provenance
        if: steps.build.outputs.built != '0' && env.TESTPYPI != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*/*.whl
            dist/*/*.tar.gz
            dist/*/*.cdx.json

      # uv publish uploads the *.publish.attestation files it is given. One file at a time, because a Rekor write can stall into a 502 and signing never retries.
      - name: Attest PyPI publish
        if: steps.build.outputs.built != '0'
        run: task ci:release:sign

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          TESTPYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}
          SELECTED: ${{ needs.plan.outputs.release-order }}
        run: task ci:release:publish

  # Package checks resolve internal dependencies from the workspace, which
  # never proves a tag installs on its own.
  verify-release:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && github.ref_name == 'main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_verify-release.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  # Runs on a push with no package change too, when `release` is skipped. The one
  # job that deploys Pages for a workspace: a root-only deploy landing after it
  # would remove the package sites, so there is no separate docs.yml.
  docs:
    needs: [checks-ok, plan, release, verify-release]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.plan.outputs.docs == 'true' && github.event_name == 'push' && github.ref_name == 'main' }}
    permissions:
      contents: write # mike pushes gh-pages
      pages: write
      id-token: write
    uses: ./.github/workflows/_docs.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  # One GitHub release per shipped release page. Gated on the barrier and on
  # `release` not failing, never on which packages were selected: a push that
  # only marks a release page shipped selects none and skips `release`.
  umbrella:
    needs: [checks-ok, release]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && needs.release.result != 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false # never cancel a running release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the umbrella releases
        run: task ci:release:umbrella
        env:
          GH_TOKEN: ${{ github.token }}

  # Everything that runs before a release, as one job: `release` and `docs` wait
  # for it, not for a list of checks. A skipped job (the fork-guarded scan, a
  # release or deploy on a pull request) passes; a failed or cancelled one does not.
  checks-ok:
    needs: [validate, dependency-review, plan, test, integration, smoke, suites, sonar, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. It adds what runs after the barrier.
  ci-ok:
    needs: [checks-ok, release, verify-release, umbrella, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
